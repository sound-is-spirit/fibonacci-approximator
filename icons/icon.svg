<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Fibonacci Approximator icon: nested squares tiling (1,1,2,3,5,8),
       lo-fi wireframe blueprint. Pure black 1px line art on white,
       hard corners, no shadows. Matches the WWWire aesthetic. -->
  <rect x="0" y="0" width="128" height="128" fill="#ffffff"/>

  <g fill="none" stroke="#111111" stroke-width="1" vector-effect="non-scaling-stroke"
     shape-rendering="crispEdges">
    <!-- 8x8 -->
    <rect x="5.5"  y="28" width="72" height="72"/>
    <!-- 5x5 -->
    <rect x="77.5" y="28" width="45" height="45"/>
    <!-- 3x3 -->
    <rect x="95.5" y="73" width="27" height="27"/>
    <!-- 2x2 -->
    <rect x="77.5" y="82" width="18" height="18"/>
    <!-- 1x1 (a) -->
    <rect x="77.5" y="73" width="9"  height="9"/>
    <!-- 1x1 (b) -->
    <rect x="86.5" y="73" width="9"  height="9"/>
  </g>

  <g fill="#111111" stroke="none" text-anchor="middle" dominant-baseline="central"
     font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="500">
    <text x="41.5" y="64"   font-size="26">8</text>
    <text x="100"  y="50.5" font-size="17">5</text>
    <text x="109"  y="86.5" font-size="10">3</text>
    <text x="86.5" y="91"   font-size="7">2</text>
    <text x="82"   y="77.5" font-size="4.5">1</text>
    <text x="91"   y="77.5" font-size="4.5">1</text>
  </g>
</svg>
