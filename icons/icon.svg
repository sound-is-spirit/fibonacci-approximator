<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Fibonacci Approximator action icon.
       Artwork from icons/fibonacci-svg-v1.svg, re-centred so the digits keep
       even 10px margins and nothing clips when Chrome scales this to 16px.
       Glyphs are Arial text: render with a machine that has Arial (macOS does).
       Ships as PNG; this file is the source. -->
  <rect width="128" height="128" fill="#ffffff"/>
  <g transform="translate(8.385,6.532) scale(0.99083)" fill="#111" style="font-family:'ArialMT','Arial',sans-serif">
    <g transform="matrix(1,0,0,1,-8,19)"><text x="4.965px" y="30.563px" style="font-size:64px">1</text></g>
    <g transform="matrix(1,0,0,1,31,82)"><text x="4.965px" y="30.563px" style="font-size:144px">2</text></g>
  </g>
</svg>
